<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Java 算法记忆卡片项目展示图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f8fb"/>
      <stop offset="1" stop-color="#eef3f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#20242c" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="48" y="42" width="1104" height="636" rx="18" fill="#ffffff" stroke="#d8dde6"/>

  <text x="86" y="96" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" fill="#b84242" font-weight="700">JAVA INTERVIEW DECK</text>
  <text x="86" y="138" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="42" fill="#20242c" font-weight="800">Java 算法记忆卡片</text>
  <text x="86" y="172" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" fill="#6b7280">题面回忆、翻面复盘、每日 10 张，把 Hot100 变成可长期复习的卡片库。</text>

  <g transform="translate(86 218)">
    <rect width="210" height="392" rx="10" fill="#f9fafb" stroke="#d8dde6"/>
    <text x="20" y="38" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" fill="#6b7280">搜索</text>
    <rect x="20" y="54" width="170" height="38" rx="7" fill="#ffffff" stroke="#d8dde6"/>
    <text x="34" y="79" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#6b7280">LC 1 / 动态规划</text>

    <text x="20" y="126" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" fill="#6b7280">专题筛选</text>
    <g font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14">
      <rect x="20" y="145" width="72" height="30" rx="15" fill="#eaf3f7" stroke="#2463a6"/>
      <text x="39" y="166" fill="#2463a6">全部</text>
      <rect x="100" y="145" width="72" height="30" rx="15" fill="#fffefa" stroke="#d8dde6"/>
      <text x="119" y="166" fill="#20242c">哈希</text>
      <rect x="20" y="184" width="88" height="30" rx="15" fill="#fffefa" stroke="#d8dde6"/>
      <text x="38" y="205" fill="#20242c">双指针</text>
      <rect x="116" y="184" width="74" height="30" rx="15" fill="#fffefa" stroke="#d8dde6"/>
      <text x="136" y="205" fill="#20242c">回溯</text>
      <rect x="20" y="223" width="104" height="30" rx="15" fill="#fffefa" stroke="#d8dde6"/>
      <text x="38" y="244" fill="#20242c">动态规划</text>
    </g>

    <rect x="20" y="288" width="48" height="58" rx="8" fill="#ffffff" stroke="#d8dde6"/>
    <rect x="80" y="288" width="48" height="58" rx="8" fill="#ffffff" stroke="#d8dde6"/>
    <rect x="140" y="288" width="48" height="58" rx="8" fill="#ffffff" stroke="#d8dde6"/>
    <text x="34" y="316" font-family="Segoe UI, sans-serif" font-size="24" fill="#2463a6" font-weight="800">100</text>
    <text x="92" y="316" font-family="Segoe UI, sans-serif" font-size="24" fill="#b84242" font-weight="800">12</text>
    <text x="154" y="316" font-family="Segoe UI, sans-serif" font-size="24" fill="#3b7c5b" font-weight="800">38</text>
    <text x="29" y="337" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#6b7280">卡片</text>
    <text x="88" y="337" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#6b7280">薄弱</text>
    <text x="148" y="337" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="12" fill="#6b7280">掌握</text>
  </g>

  <g transform="translate(328 218)" filter="url(#shadow)">
    <rect width="520" height="392" rx="12" fill="#ffffff" stroke="#d8dde6"/>
    <text x="30" y="44" font-family="Consolas, Cascadia Mono, monospace" font-size="14" fill="#6b7280">Hot100 · 新卡 · 1/100</text>
    <text x="30" y="95" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="31" fill="#20242c" font-weight="800">LC 1 两数之和</text>
    <text x="30" y="143" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" fill="#20242c">给定整数数组 nums 和整数 target，找出数组中两个</text>
    <text x="30" y="176" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="20" fill="#20242c">不同元素的下标，使它们的和等于 target。</text>
    <text x="30" y="225" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="18" fill="#6b7280">示例：</text>
    <text x="30" y="258" font-family="Consolas, Cascadia Mono, monospace" font-size="18" fill="#20242c">输入：nums = [2,7,11,15], target = 9</text>
    <text x="30" y="288" font-family="Consolas, Cascadia Mono, monospace" font-size="18" fill="#20242c">输出：[0,1]</text>
    <rect x="30" y="322" width="120" height="40" rx="7" fill="#fffefa" stroke="#d8dde6"/>
    <text x="54" y="348" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" fill="#b84242" font-weight="700">显示提示</text>
  </g>

  <g transform="translate(878 218)">
    <rect width="236" height="392" rx="10" fill="#f9fafb" stroke="#d8dde6"/>
    <text x="20" y="38" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" fill="#6b7280">智能制卡</text>
    <rect x="20" y="56" width="196" height="72" rx="8" fill="#ffffff" stroke="#d8dde6"/>
    <text x="36" y="88" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#6b7280">粘贴题目</text>
    <text x="36" y="110" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#6b7280">粘贴 Java 代码</text>
    <rect x="20" y="146" width="196" height="42" rx="7" fill="#20242c"/>
    <text x="68" y="173" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="15" fill="#ffffff" font-weight="700">生成卡片草稿</text>

    <text x="20" y="232" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16" fill="#6b7280">评分</text>
    <rect x="20" y="250" width="90" height="36" rx="7" fill="#ffffff" stroke="#b84242"/>
    <text x="39" y="273" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#b84242">没想起</text>
    <rect x="126" y="250" width="90" height="36" rx="7" fill="#ffffff" stroke="#b98121"/>
    <text x="156" y="273" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#b98121">模糊</text>
    <rect x="20" y="300" width="90" height="36" rx="7" fill="#ffffff" stroke="#3b7c5b"/>
    <text x="39" y="323" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#3b7c5b">记住了</text>
    <rect x="126" y="300" width="90" height="36" rx="7" fill="#ffffff" stroke="#3b7c5b"/>
    <text x="148" y="323" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="14" fill="#3b7c5b">已掌握</text>
  </g>

  <g transform="translate(328 634)" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="16">
    <rect width="110" height="36" rx="7" fill="#ffffff" stroke="#b84242"/>
    <text x="30" y="24" fill="#b84242">没想起</text>
    <rect x="122" width="110" height="36" rx="7" fill="#ffffff" stroke="#b98121"/>
    <text x="158" y="24" fill="#b98121">模糊</text>
    <rect x="244" width="110" height="36" rx="7" fill="#ffffff" stroke="#3b7c5b"/>
    <text x="275" y="24" fill="#3b7c5b">记住了</text>
    <rect x="366" width="110" height="36" rx="7" fill="#ffffff" stroke="#3b7c5b"/>
    <text x="397" y="24" fill="#3b7c5b">已掌握</text>
  </g>
</svg>
